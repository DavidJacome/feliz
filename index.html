<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feliz Cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --rose-deep: #8e1b3a;
    --rose: #c2185b;
    --rose-soft: #f8bbd0;
    --blush: #fdf0f3;
    --cream: #fffaf6;
    --gold: #b8860b;
    --ink: #4a2230;
    --leaf: #2e7d32;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at top, #fce4ec 0%, #f3c6d3 45%, #d98ba3 100%);
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--ink);
    overflow-x: hidden;
    padding: 24px 16px;
  }

  #root { width: 100%; display: flex; justify-content: center; }

  /* Pétalos que caen */
  .petal {
    position: fixed;
    top: -40px;
    width: 16px;
    height: 20px;
    background: radial-gradient(circle at 30% 30%, #f48fb1, #c2185b);
    border-radius: 150% 0 150% 0;
    opacity: .85;
    pointer-events: none;
    animation: fall linear infinite;
    z-index: 0;
  }
  @keyframes fall {
    0%   { transform: translate(0, -40px) rotate(0deg); }
    50%  { transform: translate(60px, 50vh) rotate(180deg); }
    100% { transform: translate(-30px, 105vh) rotate(360deg); }
  }

  /* Tarjeta */
  .card {
    position: relative;
    z-index: 1;
    width: min(440px, 100%);
    height: min(740px, calc(100vh - 48px));
    min-height: 560px;
    perspective: 1800px;
  }
  .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 1.2s cubic-bezier(.4, .2, .2, 1);
    transform-style: preserve-3d;
  }
  .inner.open { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(90, 20, 45, .35), 0 0 0 1px rgba(184, 134, 11, .25);
    overflow: hidden;
  }

  /* Portada */
  .front {
    background:
      radial-gradient(circle at 50% 35%, rgba(255,255,255,.9), transparent 60%),
      linear-gradient(160deg, var(--cream), var(--blush));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 36px 24px 28px;
    cursor: pointer;
    text-align: center;
  }
  .frame {
    position: absolute;
    inset: 12px;
    border: 1.5px solid rgba(184, 134, 11, .45);
    border-radius: 14px;
    pointer-events: none;
  }
  .frame::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(184, 134, 11, .25);
    border-radius: 10px;
  }
  .script {
    font-family: "Great Vibes", cursive;
    color: var(--rose-deep);
    line-height: 1;
  }
  .front h1 { font-size: clamp(52px, 14vw, 72px); font-weight: 400; }
  .front .name { font-size: clamp(38px, 10vw, 50px); color: var(--rose); margin-top: 6px; }
  .bouquet { width: 92%; max-width: 360px; flex: 1; min-height: 0; animation: sway 5s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  .hint {
    font-size: 15px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--gold);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

  /* Interior */
  .back {
    transform: rotateY(180deg);
    background: linear-gradient(170deg, var(--cream) 0%, #fff 50%, var(--blush) 100%);
    text-align: center;
  }
  .scroll {
    position: absolute;
    inset: 14px;
    overflow-y: auto;
    padding: 22px 16px 16px;
    scrollbar-width: none;
  }
  .scroll::-webkit-scrollbar { display: none; }
  .corner { position: absolute; pointer-events: none; z-index: 2; }
  .corner.tl { top: -10px; left: -12px; transform: rotate(-25deg); }
  .corner.tr { top: -10px; right: -12px; transform: rotate(25deg); }
  .back h2 { font-size: 46px; font-weight: 400; margin-bottom: 4px; }
  .divider {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    color: var(--gold); margin: 10px 0 16px; font-size: 14px;
  }
  .divider::before, .divider::after {
    content: ""; height: 1px; width: 70px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .message { font-size: 18px; line-height: 1.45; font-style: italic; }
  .signature { font-family: "Great Vibes", cursive; font-size: 28px; color: var(--rose); margin-top: 6px; }

  .invite {
    margin-top: 14px;
    padding: 14px 16px 16px;
    border-radius: 16px;
    background: rgba(255, 255, 255, .8);
    border: 1px dashed rgba(194, 24, 91, .4);
  }
  .invite h3 { font-family: "Great Vibes", cursive; font-weight: 400; font-size: 34px; color: var(--rose-deep); }
  .invite p.lead { font-size: 17px; margin: 4px 0 14px; }
  .options { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
  .opt {
    flex: 1;
    max-width: 150px;
    padding: 12px 8px;
    border-radius: 12px;
    border: 1.5px solid var(--rose-soft);
    background: #fff;
    font-family: inherit;
    font-size: 17px;
    color: var(--ink);
    cursor: pointer;
    transition: all .25s;
  }
  .opt .ico { font-size: 28px; display: block; margin-bottom: 2px; }
  .opt:hover { border-color: var(--rose); transform: translateY(-2px); }
  .opt.active { background: var(--rose); border-color: var(--rose); color: #fff; box-shadow: 0 8px 18px rgba(194, 24, 91, .3); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; text-align: left; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 14px; font-weight: 600; color: var(--rose-deep); letter-spacing: .05em; }
  .field input {
    width: 100%; padding: 9px 11px; border-radius: 10px; border: 1.5px solid var(--rose-soft);
    background: #fff; font-family: inherit; font-size: 16px; color: var(--ink); outline: none;
    transition: border-color .2s;
  }
  .field input:focus { border-color: var(--rose); }
  .note { font-size: 14px; font-style: italic; color: #8a5a6a; margin-bottom: 12px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .btn {
    padding: 11px 22px;
    border-radius: 999px;
    border: none;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.primary { background: linear-gradient(135deg, var(--rose), var(--rose-deep)); color: #fff; box-shadow: 0 8px 18px rgba(142, 27, 58, .35); }
  .btn.ghost { background: transparent; color: var(--rose-deep); border: 1.5px solid var(--rose-soft); }
  .answer { font-size: 19px; line-height: 1.5; animation: fadeIn .6s ease; }
  .answer .big { font-family: "Great Vibes", cursive; font-size: 38px; color: var(--rose); display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }
  .close {
    margin-top: 18px; background: none; border: none; font-family: inherit;
    color: var(--gold); font-size: 14px; letter-spacing: .15em; text-transform: uppercase; cursor: pointer;
  }

  /* Corazones al aceptar */
  .heart {
    position: fixed;
    left: 50%; top: 50%;
    font-size: 22px;
    pointer-events: none;
    z-index: 10;
    animation: burst 1.8s ease-out forwards;
  }
  @keyframes burst {
    0%   { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--r)); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .petal, .bouquet, .hint { animation: none; }
    .petal { display: none; }
    .inner { transition: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useMemo, useId } = React;

  // ✏️ Personaliza aquí
  const CONFIG = {
    nombre: "Karla",
    de: "Con mucho cariño, David",
    mensaje:
      "Espero que este nuevo año venga lleno de momentos bonitos, muchas sonrisas, sueños que se hagan realidad y personas que te hagan muy feliz. Que nunca te falten razones para sonreír y disfrutar cada etapa. ¡Feliz cumpleaños! 🥳",
  };

  const PLANES = {
    cafe:   { ico: "☕", label: "Un café",  texto: "un cafecito con postre" },
    comida: { ico: "🍽️", label: "Una comida", texto: "una comida especial" },
  };

  function Rose({ size = 100, hue = "red" }) {
    const id = useId().replace(/:/g, "");
    const palettes = {
      red:  ["#e53969", "#b0123f", "#7a0c2e"],
      pink: ["#f8a5c2", "#e56b95", "#b83b68"],
    };
    const [c1, c2, c3] = palettes[hue];
    const g = `url(#g${id})`;
    return (
      <svg viewBox="0 0 100 100" width={size} height={size}>
        <defs>
          <linearGradient id={`g${id}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={c1} />
            <stop offset="100%" stopColor={c2} />
          </linearGradient>
        </defs>
        {/* sépalos */}
        <path d="M50 92 C 38 90, 28 86, 22 80 C 34 82, 42 84, 50 86 C 58 84, 66 82, 78 80 C 72 86, 62 90, 50 92 Z" fill="#2e7d32" />
        {/* pétalos traseros */}
        <path d="M24 48 C 16 26, 34 10, 50 20 C 66 10, 84 26, 76 48 Z" fill={c2} stroke={c3} strokeWidth=".8" />
        {/* capullo central en espiral */}
        <path d="M34 44 C 30 26, 48 18, 60 26 C 70 33, 64 48, 52 46 C 44 45, 44 34, 54 34 C 58 34, 58 40, 54 40"
              fill={c3} stroke={c3} strokeWidth="1" />
        <path d="M34 44 C 30 26, 48 18, 60 26 C 70 33, 64 48, 52 46 C 44 45, 44 34, 54 34 C 58 34, 58 40, 54 40"
              fill="none" stroke={c1} strokeWidth="1.6" strokeLinecap="round" />
        {/* copa */}
        <path d="M22 44 C 20 70, 36 88, 50 88 C 64 88, 80 70, 78 44 C 66 54, 34 54, 22 44 Z" fill={g} stroke={c3} strokeWidth=".8" />
        {/* pétalo que envuelve */}
        <path d="M28 46 C 36 58, 62 60, 74 44 C 68 38, 58 42, 50 48 C 42 42, 32 38, 28 46 Z" fill={c1} stroke={c3} strokeWidth=".8" />
        {/* pétalos frontales */}
        <path d="M22 44 C 22 64, 34 80, 52 88 C 44 74, 40 60, 22 44 Z" fill={c2} stroke={c3} strokeWidth=".8" />
        <path d="M78 44 C 78 64, 66 80, 48 88 C 58 72, 62 58, 78 44 Z" fill={c1} stroke={c3} strokeWidth=".8" opacity=".95" />
        {/* brillo */}
        <path d="M60 58 C 66 56, 70 52, 72 48" fill="none" stroke="#fff" strokeOpacity=".45" strokeWidth="1.5" strokeLinecap="round" />
      </svg>
    );
  }

  function Bouquet() {
    const Leaf = ({ x, y, r, flip }) => (
      <path d="M0 0 C 12 -10, 30 -8, 38 0 C 30 8, 12 10, 0 0 Z" fill="#43a047" stroke="#1b5e20"
            strokeWidth=".8" transform={`translate(${x} ${y}) rotate(${r}) scale(${flip ? -1 : 1} 1)`} />
    );
    return (
      <svg className="bouquet" viewBox="0 0 300 320">
        {/* tallos */}
        <path d="M150 300 C 146 240, 150 190, 150 140" stroke="#2e7d32" strokeWidth="5" fill="none" />
        <path d="M150 300 C 130 240, 90 200, 70 160" stroke="#2e7d32" strokeWidth="5" fill="none" />
        <path d="M150 300 C 170 240, 210 200, 230 160" stroke="#2e7d32" strokeWidth="5" fill="none" />
        <path d="M150 300 C 135 250, 105 215, 92 185" stroke="#388e3c" strokeWidth="4" fill="none" />
        <path d="M150 300 C 165 250, 195 215, 208 185" stroke="#388e3c" strokeWidth="4" fill="none" />
        <Leaf x={148} y={220} r={-30} />
        <Leaf x={152} y={190} r={30} flip />
        <Leaf x={110} y={190} r={-60} />
        <Leaf x={190} y={190} r={60} flip />
        {/* lazo */}
        <path d="M150 262 c -30 -20, -45 5, -20 12 c -20 10, -10 30, 20 -8 c 30 38, 40 18, 20 8 c 25 -7, 10 -32, -20 -12 z"
              fill="#f8bbd0" stroke="#c2185b" strokeWidth="1.5" />
        <circle cx="150" cy="264" r="6" fill="#c2185b" />
        {/* flores */}
        <g transform="translate(57 122) rotate(-12 35 35)"><Rose size={70} /></g>
        <g transform="translate(173 122) rotate(12 35 35)"><Rose size={70} /></g>
        <g transform="translate(20 70)"><Rose size={100} hue="pink" /></g>
        <g transform="translate(180 70)"><Rose size={100} hue="pink" /></g>
        <g transform="translate(88 30)"><Rose size={124} /></g>
      </svg>
    );
  }

  function Petals() {
    const petals = useMemo(() =>
      Array.from({ length: 22 }, (_, i) => ({
        left: Math.random() * 100,
        delay: Math.random() * 12,
        duration: 9 + Math.random() * 8,
        scale: .6 + Math.random() * .8,
      })), []);
    return petals.map((p, i) => (
      <span key={i} className="petal" style={{
        left: `${p.left}vw`,
        animationDelay: `${p.delay}s`,
        animationDuration: `${p.duration}s`,
        scale: p.scale,
      }} />
    ));
  }

  function Hearts({ burstKey }) {
    const hearts = useMemo(() =>
      Array.from({ length: 32 }, () => {
        const ang = Math.random() * Math.PI * 2;
        const dist = 120 + Math.random() * 260;
        return {
          dx: `${Math.cos(ang) * dist}px`,
          dy: `${Math.sin(ang) * dist}px`,
          r: `${Math.random() * 90 - 45}deg`,
          e: ["❤️", "🌹", "💖", "✨", "🌸"][Math.floor(Math.random() * 5)],
        };
      }), [burstKey]);
    if (!burstKey) return null;
    return hearts.map((h, i) => (
      <span key={`${burstKey}-${i}`} className="heart"
            style={{ "--dx": h.dx, "--dy": h.dy, "--r": h.r }}>{h.e}</span>
    ));
  }

  function App() {
    const [open, setOpen] = useState(location.hash === "#abierta");
    const [plan, setPlan] = useState("cafe");
    const [fecha, setFecha] = useState("");
    const [hora, setHora] = useState("");
    const [lugar, setLugar] = useState("");
    const [aceptado, setAceptado] = useState(false);
    const [burst, setBurst] = useState(0);

    const listo = fecha && hora && lugar.trim();
    const hoy = new Date().toISOString().slice(0, 10);
    const aceptar = () => { setAceptado(true); setBurst(b => b + 1); };
    const fechaBonita = fecha
      ? new Date(fecha + "T12:00").toLocaleDateString("es", { weekday: "long", day: "numeric", month: "long" })
      : "";
    const horaBonita = hora
      ? new Date(`2000-01-01T${hora}`).toLocaleTimeString("es", { hour: "numeric", minute: "2-digit", hour12: true })
      : "";

    return (
      <>
        <Petals />
        <Hearts burstKey={burst} />
        <div className="card">
          <div className={`inner ${open ? "open" : ""}`}>
            {/* PORTADA */}
            <div className="face front" onClick={() => setOpen(true)} role="button" aria-label="Abrir tarjeta">
              <div className="frame" />
              <div>
                <h1 className="script">Feliz Cumpleaños</h1>
                <div className="script name">{CONFIG.nombre}</div>
              </div>
              <Bouquet />
              <div className="hint">Toca para abrir ✦</div>
            </div>

            {/* INTERIOR */}
            <div className="face back">
              <div className="frame" />
              <div className="corner tl"><Rose size={70} /></div>
              <div className="corner tr"><Rose size={70} hue="pink" /></div>
              <div className="scroll">

              <h2 className="script"> {CONFIG.nombre}</h2>
              <div className="divider">❀</div>
              <p className="message">{CONFIG.mensaje}</p>
              <div className="signature">{CONFIG.de}</div>

              <div className="invite">
                <h3>Una pequeña invitación</h3>
                <p className="lead">Para celebrarte como mereces, me encantaría invitarte a…</p>

                {!aceptado ? (
                  <>
                    <div className="options">
                      {Object.entries(PLANES).map(([k, p]) => (
                        <button key={k} className={`opt ${plan === k ? "active" : ""}`} onClick={() => setPlan(k)}>
                          <span className="ico">{p.ico}</span>{p.label}
                        </button>
                      ))}
                    </div>

                    <p className="note">Tú decides cuándo y dónde 💕</p>

                    <div className="fields">
                      <div className="field">
                        <label htmlFor="fecha">Fecha</label>
                        <input id="fecha" type="date" min={hoy} value={fecha} onChange={e => setFecha(e.target.value)} />
                      </div>
                      <div className="field">
                        <label htmlFor="hora">Hora</label>
                        <input id="hora" type="time" value={hora} onChange={e => setHora(e.target.value)} />
                      </div>
                      <div className="field full">
                        <label htmlFor="lugar">Lugar</label>
                        <input id="lugar" type="text" placeholder="Tu lugar favorito…" value={lugar}
                               onChange={e => setLugar(e.target.value)} />
                      </div>
                    </div>

                    <div className="actions" style={{ marginTop: 12 }}>
                      <button className="btn primary" disabled={!listo} onClick={aceptar}>¡Sí, acepto! 🌹</button>
                    </div>
                  </>
                ) : (
                  <div className="answer">
                    <span className="big">¡Qué alegría!</span>
                    Entonces es una cita: {PLANES[plan].texto} el <b>{fechaBonita}</b> a las <b>{horaBonita}</b> en <b>{lugar.trim()}</b>. ¡Ya quiero que llegue el día!
                    <div className="actions" style={{ marginTop: 12 }}>
                      <button className="btn ghost" onClick={() => setAceptado(false)}>Cambiar algo</button>
                    </div>
                  </div>
                )}
              </div>

              <button className="close" onClick={() => setOpen(false)}>← Cerrar tarjeta</button>
              </div>
            </div>
          </div>
        </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
